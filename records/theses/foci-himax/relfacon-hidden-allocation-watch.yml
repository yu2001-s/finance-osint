title: FOCI ReLFACon hidden-allocation watch
summary: FOCI has source-backed ReLFACon product fit for silicon-photonics CPO
  components, customer-validation and planned-delivery language in FOCI materials,
  an ongoing Himax CPO collaboration with H2 2026 limited-shipment timing, and
  Wiwynn customer-side demo adjacency. The watch thesis is that FOCI may sit near
  the CPO FAU / fiber-to-PIC interface layer, but current evidence still lacks
  BOM/AVL/procurement, named NVIDIA/TSMC/COUPE supplier allocation, order value,
  CPO revenue split, margin bridge, and current financial conversion after the
  May 29, 2026 market-data snapshot.
