pillars:
- statement: FOCI clears source-backed product fit for a CPO FAU / fiber-to-PIC
    interface layer through ReLFACon.
  depends_on:
    claims:
    - claim:foci:relfacon-cpo-product-fit
    relationships:
    - relationship:foci:manufactures-relfacon
    - relationship:foci-relfacon:supports-cpo
    - relationship:fau-fiber-to-pic-coupling-interface:supports-cpo
  proof_points:
  - Customer-side or platform-owner source naming ReLFACon or FOCI FAU in a production
    CPO BOM, AVL, procurement flow, or service part list.
  kill_criteria:
  - Named high-volume FAU supplier evidence showing the CPO platform work went
    elsewhere, or later source evidence limiting ReLFACon activity to demos/samples.
- statement: Himax and Wiwynn strengthen customer-adjacent validation, but neither
    source currently proves production supplier allocation or material revenue.
  depends_on:
    claims:
    - claim:himax:foci-cpo-collaboration
    - claim:himax:q1-2026-foci-limited-shipments
    - claim:wiwynn:computex-cpo-demo-names-foci
    relationships:
    - relationship:foci-himax:cpo-development-partnership
    events:
    - event:foci-himax:limited-cpo-shipments-h2-2026
  proof_points:
  - Himax, Wiwynn, FOCI, NVIDIA, TSMC, or SPIL source naming FOCI/ReLFACon in
    production qualification, supplier allocation, order, or revenue context.
  kill_criteria:
  - H2 2026/2027 shipment language remains sample-level or demo-only without
    customer, order, or revenue conversion.
- statement: The valuation and current financial monitor make conversion proof
    necessary before the thesis can move beyond watch.
  depends_on:
