next_missing_evidence:
- Named FOCI/ReLFACon customer, platform, BOM, AVL, procurement, or service-part
  source.
- Exact order value, production order, shipment volume, customer concentration,
  or CPO revenue split.
- Gross margin, cash conversion, and capex evidence tied to ReLFACon/CPO FAU.
- Confirmation that H2 2026 limited shipments and 2026 specified-quantity deliveries
  occurred and converted into product-coded revenue.
