    metrics:
    - metric:chroma-ate:market-cap-20260529
    - metric:chroma-ate:price-to-sales-20260529
  proof_points:
  - Filing, transcript, or customer-side evidence tying CPO insertion test orders
    to revenue, gross margin, or named production programs.
  kill_criteria:
  - Continued absence of named customer/order-value/revenue bridge while valuation
    remains elevated.
next_missing_evidence:
- Named Chroma CPO customer or platform.
- Exact order value or repeat purchase evidence for CPO insertion test systems.
- CPO-specific revenue split, gross margin, and cash conversion.
- Confirmation that the June 2026 Insertion 4E BER pilot occurred and converted.
