title: Chroma CPO insertion test watch
summary: Chroma has source-backed SiPh/PIC reliability-test products and transcript-hosted
  management language about CPO insertion test purchase orders. The watch thesis
  is that Chroma may be exposed to CPO optical-engine production test workflows,
  but current evidence still lacks named customer/platform proof, exact order value,
  CPO revenue split, gross margin bridge, and valuation conversion after the May
  29, 2026 market-data snapshot.
