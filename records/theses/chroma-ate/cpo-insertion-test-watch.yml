pillars:
- statement: Chroma clears source-backed product and process exposure to SiPh/PIC
    reliability testing and CPO insertion test workflows.
  depends_on:
    claims:
    - claim:chroma-ate:siph-pic-reliability-test-product-fit
    - claim:chroma-ate:q1-2026-cpo-insertion-purchase-orders
    relationships:
    - relationship:chroma-ate:manufactures-siph-pic-reliability-test-systems
    - relationship:cpo-insertion-test-workflow:supports-cpo
  proof_points:
  - Customer-side or platform-owner source naming Chroma equipment in a CPO optical-engine
    production or qualification workflow.
  kill_criteria:
  - Later primary evidence showing the purchase-order or pilot language did not
    convert into production equipment shipments or recurring CPO test demand.
- statement: The purchase-order language is stronger than product-page proof but
    still does not prove named customer, order value, revenue, margin, or valuation
    conversion.
  depends_on:
    claims:
    - claim:chroma-ate:q1-2026-cpo-insertion-purchase-orders
