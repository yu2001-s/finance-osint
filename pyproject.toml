[project]
name = "finance-osint"
version = "0.1.0"
description = "Community-driven finance OSINT research database."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.scripts]
fo = "fosint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fosint*"]

[tool.ruff]
line-length = 100
target-version = "py311"
