schema_version: 1
kind: relationship_type
id: manufactures_product
label: Manufactures Product
description: An entity manufactures, assembles, or ramps production of a product or component.
state: registered
ontology_version: 1
directional: true
roles:
  - name: manufacturer
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company]
    description: Entity manufacturing, assembling, or ramping the product.
  - name: product
    required: true
    min: 1
    max: 1
    allowed_entity_types: [product, component]
    description: Product or component being manufactured, assembled, or ramped.
allowed_scope:
  - geography
  - market
  - customer
  - segment
  - architecture
  - technology
allowed_qualifiers:
  - volume_ramp
  - product_fit
  - announced
  - expected
inverse_type: null
inverse_behavior: none
materiality:
  allowed_values: [low, medium, high, critical]
evidence_required: true
