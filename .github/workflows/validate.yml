name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Resolve validation base
        run: |
          uv run python scripts/resolve_validation_base.py \
            --event-name "${{ github.event_name }}" \
            --pull-request-base-sha "${{ github.event.pull_request.base.sha }}" \
            --push-before-sha "${{ github.event.before }}" \
            --github-env "$GITHUB_ENV" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
      - name: Validate with timing
        run: |
          uv run python scripts/validate_with_timing.py "$BASE_REF" \
            --json \
            --output .local/ci/validation-timings.json \
            --markdown-summary .local/ci/validation-timings.md
      - name: Run 10k generated scale smoke
        run: |
          uv run python scripts/scale_smoke.py \
            --records 10000 \
            --json \
            --output .local/ci/scale-smoke-10k.json
      - name: Build GitHub review view
        run: |
          uv run fo view build "$BASE_REF" \
            --json \
            --output .local/ci/github-view
      - name: Append timing summary
        if: always()
        run: |
          if [ -f .local/ci/validation-timings.md ]; then
            cat .local/ci/validation-timings.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .local/ci/github-view/pr-review.md ]; then
            cat .local/ci/github-view/pr-review.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: .local/ci/*.json
          if-no-files-found: ignore
      - name: Upload GitHub review view
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-view
          path: .local/ci/github-view/**/*.md
          if-no-files-found: ignore
