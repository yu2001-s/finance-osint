name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Lint records
        run: uv run fo lint --json
      - name: Run tests
        run: uv run python -m unittest discover -s tests
      - name: Build local SQLite index
        run: uv run fo index build --json
      - name: Build local graph
        run: uv run fo graph build --json
