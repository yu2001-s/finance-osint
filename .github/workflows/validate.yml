name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Lint records
        run: uv run fo lint --json
      - name: Diff-review PR records
        if: github.event_name == 'pull_request'
        run: uv run fo diff-review "origin/${{ github.base_ref }}" --json
      - name: Run tests
        run: uv run python -m unittest discover -s tests
      - name: Build local SQLite index
        run: uv run fo index build --json
      - name: Chain-review changed theses and relationships
        if: github.event_name == 'pull_request'
        run: uv run python scripts/chain_review_changed.py "origin/${{ github.base_ref }}"
      - name: Build local graph
        run: uv run fo graph build --json
