pillars:
- statement: The X-FAB/Navitas relationship is source-backed by a customer-side
    SEC filing, not just inferred from product fit.
  depends_on:
    claims:
    - claim:navitas:fy2025-10k-xfab-sic-manufacturer
    relationships:
    - relationship:navitas:xfab-sic-manufacturing-partner
  proof_points:
  - Navitas, X-FAB, or customer-side source quantifying wafer starts, order value,
    revenue split, or margin tied to X-FAB-manufactured Navitas SiC.
  kill_criteria:
  - Later filing or customer disclosure showing Navitas moved material SiC manufacturing
    away from X-FAB or that the relationship is immaterial.
- statement: The 800 VDC relevance exists at the device-layer search-surface level,
    but the NVIDIA revenue bridge is still open.
  depends_on:
    claims:
    - claim:navitas:800-vdc-device-layer-support
    - claim:xfab:navitas-800vdc-chain-revenue-unproven
    relationships:
    - relationship:navitas-sic-products:supports-800-vdc
    - relationship:wide-bandgap-power-semiconductors:supports-800-vdc
  proof_points:
  - NVIDIA, Navitas, or X-FAB source naming X-FAB-manufactured Navitas SiC in
    qualified, ordered, production, procurement, or service-part context.
  kill_criteria:
  - 800 VDC WBG design wins route to non-X-FAB manufacturers, or X-FAB WBG growth
    fails to connect to Navitas/customer-specific revenue.
- statement: Q1 2026 WBG revenue and SiC wafer shipments are real but broad, while
    social-media rerating is only market-recognition evidence.
  depends_on:
    claims:
    - claim:xfab:q1-2026-wbg-revenue-watch
    - claim:xfab:social-rerating-20260527
    - claim:xfab:valuation-snapshot-20260529
    metrics:
    - metric:xfab:q1-2026-wide-bandgap-revenue
    - metric:xfab:q1-2026-sic-wafer-shipments
    - metric:xfab:market-cap-20260529
    - metric:xfab:price-to-sales-20260529
  proof_points:
  - X-FAB disclosures that split WBG revenue or margin by customer, product, or
    AI data-center / 800 VDC end market.
  kill_criteria:
  - Market recognition remains elevated while disclosures stay broad and no customer-specific
    conversion appears.
next_missing_evidence:
- Navitas/X-FAB wafer-start, order-value, shipment-volume, revenue-split, or margin
  disclosure.
- NVIDIA qualification, production use, purchase order, procurement, or service
  evidence naming Navitas SiC manufactured by X-FAB.
- X-FAB WBG customer split and product-level gross-margin bridge.
- Later disclosures showing whether social-media rerating was followed by source-backed
  revenue conversion.
