title: AXT / Sumitomo InP substrate bottleneck watch
summary: AXT and Sumitomo Electric have source-backed InP substrate and data-center
  optical layer exposure. The watch thesis is that InP substrate availability may
  matter for AI optical links, but the current canonical evidence still lacks named
  customer/design-in proof, current market-share proof, and revenue/cash conversion
  proof after AXT's May 29, 2026 rerating.
