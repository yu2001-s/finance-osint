schema_version: 1
kind: relationship_type
id: qualified_supplier
label: Qualified Supplier
description: A buyer, OEM, platform owner, or program has qualified a supplier or supplied item for a product, component, service, technology, or supply program.
state: registered
ontology_version: 1
directional: true
roles:
  - name: supplier
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company]
    description: Entity qualified to supply.
  - name: qualifier
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company]
    description: Buyer, OEM, platform owner, or program owner that qualified the supplier.
  - name: qualified_item
    required: false
    min: 0
    max: 1
    allowed_entity_types: [product, component, technology, service]
    description: Specific product, component, technology, or service that was qualified.
allowed_scope:
  - product
  - component
  - technology
  - service
  - program
  - qualification_stage
  - geography
  - market
allowed_qualifiers:
  - sample_qualified
  - volume_qualified
  - approved_vendor
  - sole_qualified
  - multi_source
  - direct_statement
  - inferred
inverse_type: null
inverse_behavior: none
materiality:
  allowed_values: [low, medium, high, critical]
evidence_required: true
