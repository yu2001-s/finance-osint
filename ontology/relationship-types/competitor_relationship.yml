schema_version: 1
kind: relationship_type
id: competitor_relationship
label: Competitor Relationship
description: Entities compete in a market, product category, customer segment, or use case.
state: registered
ontology_version: 1
directional: false
roles:
  - name: competitor_a
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company, product]
    description: One competing entity.
  - name: competitor_b
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company, product]
    description: Another competing entity.
allowed_scope:
  - product
  - market
  - geography
  - customer_segment
allowed_qualifiers:
  - direct
  - indirect
  - emerging
  - substitute
inverse_type: competitor_relationship
inverse_behavior: derive_local
materiality:
  allowed_values: [low, medium, high, critical]
evidence_required: true
