schema_version: 1
kind: relationship_type
id: supplier_relationship
label: Supplier Relationship
description: One entity provides goods, components, infrastructure, or services to another entity.
state: registered
ontology_version: 1
directional: true
roles:
  - name: supplier
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company]
    description: Entity providing the good, component, infrastructure, or service.
  - name: buyer
    required: true
    min: 1
    max: 1
    allowed_entity_types: [company]
    description: Entity receiving or buying from the supplier.
allowed_scope:
  - product
  - component
  - service
  - geography
  - market
  - technology
allowed_qualifiers:
  - upstream
  - downstream
  - sole_supplier
  - strategic_supplier
  - commodity_supplier
  - outsourced
inverse_type: customer_relationship
inverse_behavior: derive_local
materiality:
  allowed_values: [low, medium, high, critical]
evidence_required: true
